# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Simula Summer School in Computational Physiology
author: SSCP Instructors
logo: "logos/sscp_logo.png"
copyright: "2026"
only_build_toc_files: true

# Cache execution of notebooks

# See https://jupyterbook.org/content/execute.html
execute:
  exclude_patterns:
    - .pixi/*
  execute_notebooks: "off"
  timeout: 1800

# Information about where the book exists on the web
repository:
  url: https://github.com/Simula-SSCP/SSCP_lectures # Online location of your book
  path_to_book: . # Optional path to your book, relative to the repository root
  branch: main # Which branch of the repository should be used when creating links (optional)

launch_buttons:
  notebook_interface: "jupyterlab"
  jupyterhub_url: https://sscp.simula.no
  #binderhub_url: "https://mybinder.org"

html:
  favicon: "logos/favicon.ico"
  home_page_in_navbar: true
  #use_multitoc_numbering: true
  use_issues_button: true
  use_repository_button: true

  extra_footer: |
    <div>
        This webpage is distributed under the terms of the <a href=https://choosealicense.com/licenses/mit/>MIT License</a>.
        If you use this work, please cite it appropriately.
    </div>

parse:
  myst_enable_extensions:
    - "amsmath"
    - "colon_fence"
    - "deflist"
    - "dollarmath"
    - "html_admonition"
    - "html_image"
    - "linkify"
    - "replacements"
    - "smartquotes"
    - "substitution"
  myst_url_schemes: [mailto, http, https] # URI schemes that will be recognised as external URLs in Markdown links

sphinx:
  config:
    html_last_updated_fmt: "%b %d, %Y"
    suppress_warnings: ["mystnb.unknown_mime_type"]
    codeautolink_concat_default: True

    html_context:
      default_mode: "light"

    # To avoid warning about default changing due to
    # https://github.com/pydata/pydata-sphinx-theme/issues/1492
    # html_theme_options:
    #   navigation_with_keys: false
    intersphinx_mapping:
      basix: ["https://docs.fenicsproject.org/basix/main/python/", null]
      ffcx: ["https://docs.fenicsproject.org/ffcx/main/", null]
      ufl: ["https://docs.fenicsproject.org/ufl/main/", null]
      dolfinx: ["https://docs.fenicsproject.org/dolfinx/main/python", null]
      petsc4py: ["https://petsc.org/release/petsc4py", null]
      mpi4py: ["https://mpi4py.readthedocs.io/en/stable", null]
      numpy: ["https://numpy.org/doc/stable/", null]
      pyvista: ["https://docs.pyvista.org/", null]
      packaging: ["https://packaging.pypa.io/en/stable/", null]
      matplotlib: ["https://matplotlib.org/stable/", null]

  extra_extensions:
    - "sphinx.ext.autodoc"
    - "sphinx.ext.intersphinx"
    - "sphinx_exercise"
    #- "sphinx_codeautolink"
    #- "sphinx_multitoc_numbering"

  local_extensions:
    fix_autolink: .

exclude_patterns:
  - README.md
  - .pixi/*
